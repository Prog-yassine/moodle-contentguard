name: contentguard-demo
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?Create .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U moodle -d moodle]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  web:
    image: contentguard-php:local
    build:
      context: .
      secrets:
        - proxy_ca
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      CONTENTGUARD_STUDENT_PASSWORD: ${CONTENTGUARD_STUDENT_PASSWORD}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
      MOODLE_REVERSE_PROXY: ${MOODLE_REVERSE_PROXY:-0}
    volumes:
      - ./runtime/moodle51:/var/www/html
      - ./plugin/local/contentguard:/var/www/html/public/local/contentguard:ro
      - ./scripts:/opt/contentguard:ro
      - ./runtime/php-demo.ini:/etc/php83/conf.d/zz-contentguard.ini:ro
      - moodle_data:/var/moodledata
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php83, -r, 'exit(@fsockopen("127.0.0.1", 8080) ? 0 : 1);']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
  moodle_data:
secrets:
  proxy_ca:
    file: ${CONTENTGUARD_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
